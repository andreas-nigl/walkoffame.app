function approx(e){if(e.lat!=null)return {lat:e.lat,lon:e.lon,estimated:false};let m=e.address.match(/(\d+)/);if(!m)return null;let n=+m[1];if(/Vine/i.test(e.address))return {lat:34.0965+(n-1400)*0.000016,lon:-118.32675,estimated:true};if(/Hollywood/i.test(e.address)&&n>=6000&&n<=7300)return {lat:34.10167,lon:-118.32675-(n-6300)*0.000024,estimated:true};return null}
for(const e of entries)e.point=approx(e);
function xy(p){return{x:600+(p.lon+118.32675)*60000,y:340-(p.lat-34.10167)*73000}}
function fromXY(x,y){return {lat:34.10167-(y-340)/73000,lon:-118.32675+(x-600)/60000}}
function dist(a,b){let d=(b.lat-a.lat)*Math.PI/180,l=(b.lon-a.lon)*Math.PI/180,z=Math.sin(d/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(l/2)**2;return Math.round(12742000*Math.atan2(Math.sqrt(z),Math.sqrt(1-z)))}
function safe(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function favorites(){try{return JSON.parse(localStorage.getItem("wof-favs")||"[]")}catch{return[]}}
function toggleFav(id){let a=favorites();a=a.includes(id)?a.filter(x=>x!==id):[...a,id];try{localStorage.setItem("wof-favs",JSON.stringify(a))}catch{};render()}
function items(){let q=$("search").value.trim().toLocaleLowerCase();let a=entries.filter(e=>(filter==="all"||e.category===filter)&&(!favOnly||favorites().includes(e.id))&&(!q||(e.name+" "+e.address).toLocaleLowerCase().includes(q)));let sort=$("sort").value;a.sort((a,b)=>sort==="distance"&&position?(a.point?dist(position,a.point):Infinity)-(b.point?dist(position,b.point):Infinity):sort==="category"?a.category.localeCompare(b.category)||a.name.localeCompare(b.name):a.name.localeCompare(b.name));return a}
function panel(open){$("layout").classList.toggle("closed",!open);$("tab").textContent=open?"⌄ Suche / Liste schließen":"☰ Suche / Liste öffnen";$("tab").setAttribute("aria-expanded",String(open))}
const pict={film:"▣",tv:"▤",music:"◉",radio:"♩",theatre:"◈",sport:"♜",special:"✦",empty:"☆"};
function roads(){let bg=$("blocks"),g=$("roads");bg.replaceChildren();g.replaceChildren();for(let x=-700;x<2000;x+=155)for(let y=-400;y<1100;y+=130){if(Math.abs(x+65-600)<80||Math.abs(y+50-340)<68)continue;bg.append(el("rect",{x:x+8,y:y+9,width:121,height:92,rx:3,fill:"#d2cec5",stroke:"#b9b4aa"}));bg.append(el("rect",{x:x+22,y:y+22,width:78,height:56,fill:"#bdb8ad",opacity:".5"}))}for(const [y,n] of [[240,"Yucca St"],[340,"Hollywood Blvd"],[430,"Sunset Blvd"]]){g.append(el("line",{x1:-700,y1:y,x2:2100,y2:y,stroke:"#fff","stroke-width":28}));g.append(el("line",{x1:-700,y1:y,x2:2100,y2:y,stroke:"#aaa","stroke-width":1,"stroke-dasharray":"8 10"}));g.append(el("text",{x:20,y:y-23,class:"street"},n))}for(const [x,n] of [[-450,"La Brea Ave"],[-130,"Highland Ave"],[300,"Cahuenga Blvd"],[600,"Vine St"],[930,"Gower St"]]){g.append(el("line",{x1:x,y1:-400,x2:x,y2:1100,stroke:"#fff","stroke-width":28}));g.append(el("line",{x1:x,y1:-400,x2:x,y2:1100,stroke:"#aaa","stroke-width":1,"stroke-dasharray":"8 10"}));g.append(el("text",{x:x+17,y:160,class:"street",transform:"rotate(-90 "+(x+17)+" 160)"},n))}}
function starPath(x,y,r){let d="";for(let i=0;i<10;i++){let a=-Math.PI/2+i*Math.PI/5,z=i%2?r*.47:r;d+=(i?"L":"M")+(x+Math.cos(a)*z)+" "+(y+Math.sin(a)*z)+" "}return d+"Z"}
function mapRender(a){let g=$("stars");g.replaceChildren();let mapped=a.filter(e=>e.point),groups=[];if(scale<1.6&&mapped.length>35){let bins=new Map(),cell=45/scale;for(let e of mapped){let p=xy(e.point),k=Math.floor(p.x/cell)+":"+Math.floor(p.y/cell);if(!bins.has(k))bins.set(k,[]);bins.get(k).push(e)}groups=[...bins.values()]}else groups=mapped.map(e=>[e]);for(let group of groups){let p={x:0,y:0};for(let e of group){let q=xy(e.point);p.x+=q.x;p.y+=q.y}p.x/=group.length;p.y/=group.length;if(group.length>1){let c=el("circle",{cx:p.x,cy:p.y,r:14/Math.sqrt(scale),fill:"#a94265",stroke:"white","stroke-width":2,role:"button",tabindex:"0"}),t=el("text",{x:p.x,y:p.y+4/Math.sqrt(scale),"text-anchor":"middle","font-size":12/Math.sqrt(scale),fill:"white","font-weight":"bold","pointer-events":"none"},String(group.length));c.addEventListener("click",ev=>{ev.stopPropagation();center(fromXY(p.x,p.y),Math.min(5,Math.max(2,scale*2)));render()});c.addEventListener("mouseenter",()=>{$("tip").textContent=group.length+" Sterne · zum Vergrößern anklicken";$("tip").hidden=false});c.addEventListener("mouseleave",()=>{$("tip").hidden=true});g.append(c,t);continue}let e=group[0],rad=(scale>2?16:11)/Math.sqrt(scale),c=el("path",{d:starPath(p.x,p.y,rad),fill:e.point.estimated?"#c45c77":"#d7b574",stroke:selected===e.id?"#175bd4":"#25364c","stroke-width":selected===e.id?2.5:1.4,class:"marker"+(selected===e.id?" selected":""),tabindex:"0",role:"button","aria-label":e.name+" "+cats[e.category]}),t=el("text",{x:p.x,y:p.y+rad*.12,"text-anchor":"middle","dominant-baseline":"middle","font-size":rad*.78,fill:"#152338","font-weight":"bold","pointer-events":"none"},pict[e.category]||"★");c.addEventListener("click",ev=>{ev.stopPropagation();choose(e.id)});c.addEventListener("mouseenter",()=>{$("tip").textContent=e.name+" · "+cats[e.category];$("tip").hidden=false});c.addEventListener("mouseleave",()=>{$("tip").hidden=true});c.addEventListener("keydown",ev=>{if(ev.key==="Enter")choose(e.id)});g.append(c,t)}let pg=$("position");pg.replaceChildren();if(position){let p=xy(position);pg.append(el("circle",{cx:p.x,cy:p.y,r:14,fill:"#277bd644"}));pg.append(el("circle",{cx:p.x,cy:p.y,r:7,fill:"#1674dc",stroke:"white","stroke-width":3}))}}
function render(){let a=items();$("count").textContent=a.length+" von "+entries.length+" Einträgen · "+a.filter(x=>x.point).length+" kartiert (meist geschätzt)";let r=$("results");r.replaceChildren();for(const e of a){let b=document.createElement("button");b.className="result"+(selected===e.id?" sel":"");b.innerHTML="<strong>"+safe(e.name)+"</strong> "+(favorites().includes(e.id)?"★":"")+"<small>"+safe(cats[e.category])+" · "+safe(e.address)+"</small><small>"+(e.point?(e.point.estimated?"≈ Kartenpunkt aus Hausnummer":"Kreuzungsreferenz")+(position?" · ≈ "+dist(position,e.point)+" m":""):"Keine Kartenposition")+"</small>";b.onclick=()=>choose(e.id);r.append(b)}mapRender(a)}
function move(){ mapRender(items()); $("scene").setAttribute("transform","translate("+offset.x+" "+offset.y+") scale("+scale+")")}
function center(p,z){scale=z;let a=xy(p);offset={x:600-a.x*scale,y:360-a.y*scale};move()}
function choose(id){let e=entries.find(x=>x.id===id);if(!e)return;selected=id;let d=$("detail");d.hidden=false;d.innerHTML="<h3>"+safe(e.name)+"</h3><p>"+safe(cats[e.category])+" · "+safe(e.address)+"</p><p>"+safe(e.precision)+"</p>"+(position&&e.point?"<p>≈ "+dist(position,e.point)+" m Luftlinie</p>":"")+"<p><a target='_blank' rel='noopener' href='"+safe(e.source)+"'>Quelle öffnen ↗</a></p><button id='favdetail'>"+(favorites().includes(id)?"★ Entfernen":"☆ Favorit")+"</button> <button id='closedetail'>Schließen</button>";$("favdetail").onclick=()=>toggleFav(id);$("closedetail").onclick=()=>{d.hidden=true;selected=null;render()};if(e.point)center(e.point,Math.max(scale,1.5));render();panel(false)}
function gps(){if(watch!==null){navigator.geolocation.clearWatch(watch);watch=null;$("gps").textContent="◎ GPS starten";return}if(!isSecureContext||!navigator.geolocation){alert("GPS benötigt HTTPS. Alternativ Standort manuell auf der Karte setzen.");return}watch=navigator.geolocation.watchPosition(p=>{position={lat:p.coords.latitude,lon:p.coords.longitude};$("status").textContent="GPS ±"+Math.round(p.coords.accuracy)+" m · Position nur lokal";render()},e=>{$("status").textContent="GPS: "+e.message+" · manuelle Position möglich"},{enableHighAccuracy:true,maximumAge:10000,timeout:20000});$("gps").textContent="● GPS stoppen"}
$("gps").onclick=gps;$("tab").onclick=()=>panel($("layout").classList.contains("closed"));$("search").oninput=render;$("sort").onchange=render;$("filters").innerHTML=Object.entries(cats).map(([k,v])=>"<button data-cat='"+k+"'>"+v+"</button>").join("");$("filters").onclick=e=>{let b=e.target.closest("button[data-cat]");if(!b)return;filter=b.dataset.cat;for(let x of $("filters").children)x.classList.toggle("active",x===b);render()};$("filters").firstChild.classList.add("active");$("favorites").onclick=()=>{favOnly=!favOnly;$("favorites").classList.toggle("active",favOnly);render()};$("random").onclick=()=>{let a=items();if(a.length)choose(a[Math.floor(Math.random()*a.length)].id)};$("nearest").onclick=()=>{if(!position){alert("Bitte GPS aktivieren oder Position setzen.");return}let a=items().filter(e=>e.point).sort((a,b)=>dist(position,a.point)-dist(position,b.point));if(a.length)choose(a[0].id)};$("manual").onclick=()=>{manual=true;panel(false);$("status").textContent="Jetzt auf die Karte tippen, um die Position zu setzen"};$("plus").onclick=()=>{scale=Math.min(5,scale*1.25);move()};$("minus").onclick=()=>{scale=Math.max(.35,scale*.8);move()};$("home").onclick=()=>center({lat:34.10167,lon:-118.333},.85);
let map=$("map");map.onpointerdown=e=>{if(e.target.classList.contains("marker"))return;drag={x:e.clientX,y:e.clientY,ox:offset.x,oy:offset.y,moved:false};map.setPointerCapture(e.pointerId)};map.onpointermove=e=>{if(!drag)return;let r=map.getBoundingClientRect(),dx=(e.clientX-drag.x)*1200/r.width,dy=(e.clientY-drag.y)*720/r.height;if(Math.hypot(dx,dy)>5)drag.moved=true;offset={x:drag.ox+dx,y:drag.oy+dy};move()};map.onpointerup=e=>{if(drag&&!drag.moved&&manual){let r=map.getBoundingClientRect(),x=(e.clientX-r.left)*1200/r.width,y=(e.clientY-r.top)*720/r.height;position=fromXY((x-offset.x)/scale,(y-offset.y)/scale);manual=false;$("status").textContent="Standort manuell gesetzt · nur lokale Berechnung";render()}drag=null};map.onwheel=e=>{e.preventDefault();scale=Math.min(5,Math.max(.35,scale*(e.deltaY<0?1.1:.9)));move()};roads();center({lat:34.10167,lon:-118.333},.85);render();
</script></body></html>
